events {
    worker_connections 1024;
}

http {
    upstream api_cluster {
        least_conn;
        server api-1:5000 max_fails=3 fail_timeout=10s;
        server api-2:5000 max_fails=3 fail_timeout=10s;
        server api-3:5000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;

        location /api/ {
            proxy_pass http://api_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        location /health {
            proxy_pass http://api_cluster/health;
        }

        location /ready {
            proxy_pass http://api_cluster/ready;
        }

        location / {
            proxy_pass http://client:5173;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}

