services:
  # Local MongoDB replica set (required for multi-document ACID transactions)
  mongo:
    image: mongo:7.0
    container_name: cinema-mongo
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: >
        mongosh --port 27017 --eval "
          try {
            rs.status().ok
          } catch (e) {
            rs.initiate({
              _id: 'rs0',
              members: [{ _id: 0, host: 'mongo:27017' }]
            }).ok
          }
        "
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 2s

  # Dedicated Background Worker (hold sweeper, reconciliation)
  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cinema-worker
    command: ["node", "dist/worker.js"]
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/cinema_db?replicaSet=rs0
      - HOLD_SWEEPER_INTERVAL_MS=30000
    depends_on:
      mongo:
        condition: service_healthy

  # API Replica 1
  api-1:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cinema-api-1
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/cinema_db?replicaSet=rs0
      - JWT_SECRET=super_secret_jwt_key_at_least_32_characters_long
      - CLIENT_URL=http://localhost
    depends_on:
      mongo:
        condition: service_healthy

  # API Replica 2
  api-2:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cinema-api-2
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/cinema_db?replicaSet=rs0
      - JWT_SECRET=super_secret_jwt_key_at_least_32_characters_long
      - CLIENT_URL=http://localhost
    depends_on:
      mongo:
        condition: service_healthy

  # API Replica 3
  api-3:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cinema-api-3
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/cinema_db?replicaSet=rs0
      - JWT_SECRET=super_secret_jwt_key_at_least_32_characters_long
      - CLIENT_URL=http://localhost
    depends_on:
      mongo:
        condition: service_healthy

  # Nginx Reverse Proxy / Load Balancer
  nginx:
    image: nginx:alpine
    container_name: cinema-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2
      - api-3

volumes:
  mongo_data:
